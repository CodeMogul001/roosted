    <script>
      // Defensive guard against browser extension injection collisions (e.g., Zerion, MetaMask, Phantom)
      (function() {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return origDefineProperty.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (
                err instanceof TypeError &&
                (String(prop).toLowerCase().includes('zerion') ||
                 String(err.message).toLowerCase().includes('cannot redefine property'))
              ) {
                try {
                  if (descriptor && 'value' in descriptor) {
                    obj[prop] = descriptor.value;
                  }
                } catch (_) {}
                return obj;
              }
              throw err;
            }
          };

          window.addEventListener('error', function(event) {
            var msg = (event.message || (event.error && event.error.message) || '').toLowerCase();
            var file = (event.filename || '').toLowerCase();
            if (
              msg.includes('iszerion') ||
              msg.includes('cannot redefine property') ||
              file.includes('chrome-extension://') ||
              file.includes('moz-extension://')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var msg = (reason && (reason.message || String(reason)) || '').toLowerCase();
            if (
              msg.includes('iszerion') ||
              msg.includes('cannot redefine property') ||
              msg.includes('chrome-extension://')
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        } catch (_) {}
      })();
    </script>
